<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세포 탐험: 도트로 보는 식물세포와 동물세포</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e9edf2;
  --glass: rgba(246,247,251,0.8); --glass-2: rgba(250,250,253,0.88); --glass-edge: rgba(255,255,255,0.75); --glass-shadow: 0 10px 40px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.6) inset;
  --ink: #1c1c1e; --ink-2: #3a3a3c; --muted: rgba(60,60,67,0.72); --hair: rgba(60,60,67,0.16);
  --fill: rgba(118,118,128,0.14); --fill-2: rgba(118,118,128,0.22);
  --accent: #007aff; --accent-ink: #ffffff; --accent-soft: rgba(0,122,255,0.14); --green: #34c759; --focus: #007aff;
  --card: rgba(255,255,255,0.72);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --vis-l: 12px; --vis-b: 12px; --vis-t: 80px; --vis-r: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05070d;
    --glass: rgba(30,32,42,0.52); --glass-2: rgba(40,42,54,0.7); --glass-edge: rgba(255,255,255,0.14); --glass-shadow: 0 12px 44px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.08) inset;
    --ink: #f5f5f7; --ink-2: #e5e5ea; --muted: rgba(235,235,245,0.62); --hair: rgba(255,255,255,0.1);
    --fill: rgba(118,118,128,0.24); --fill-2: rgba(118,118,128,0.34);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,0.22); --green: #30d158; --focus: #64aaff; --card: rgba(255,255,255,0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05070d; --glass: rgba(30,32,42,0.52); --glass-2: rgba(40,42,54,0.7); --glass-edge: rgba(255,255,255,0.14); --glass-shadow: 0 12px 44px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.08) inset;
  --ink: #f5f5f7; --ink-2: #e5e5ea; --muted: rgba(235,235,245,0.62); --hair: rgba(255,255,255,0.1); --fill: rgba(118,118,128,0.24); --fill-2: rgba(118,118,128,0.34);
  --accent: #0a84ff; --accent-soft: rgba(10,132,255,0.22); --green: #30d158; --focus: #64aaff; --card: rgba(255,255,255,0.06); color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; overflow: hidden; background: #04060c; color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "IBM Plex Sans KR", system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(28px) saturate(185%); backdrop-filter: blur(28px) saturate(185%); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); }
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) { .glass { background: var(--glass-2); } }

/* ---------- stage ---------- */
.stagewrap { position: fixed; inset: 0; }
#stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stagecap { position: fixed; left: calc(var(--vis-l) + 8px); top: calc(var(--vis-t) + 6px); margin: 0; color: rgba(235,235,245,0.55); font: 600 11px/1 "Silkscreen", ui-monospace, monospace; letter-spacing: .04em; pointer-events: none; }
#tooltip { position: fixed; left: 0; top: 0; pointer-events: none; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; background: rgba(30,32,42,0.6); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.18); }
#hint { position: fixed; left: 76px; bottom: calc(var(--vis-b) + 14px); margin: 0; max-width: min(440px, calc(100vw - var(--vis-r) - 100px)); padding: 10px 16px; border-radius: 18px; font-size: 13px; color: #fff; background: rgba(30,32,42,0.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.16); transition: opacity .6s, transform .6s; }
#hint.gone { opacity: 0; transform: translateY(8px); pointer-events: none; }
.zoom { position: fixed; left: 16px; bottom: calc(var(--vis-b) + 14px); display: flex; flex-direction: column; align-items: stretch; border-radius: 22px; overflow: hidden; background: rgba(30,32,42,0.55); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
.zoom button { width: 46px; height: 46px; border: 0; background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center; }
.zoom button:hover { background: rgba(255,255,255,0.1); }
.zoom output { font: 600 10px/1 ui-monospace, Menlo, monospace; color: rgba(235,235,245,0.7); text-align: center; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); }

/* ---------- top bar ---------- */
.bar { position: fixed; z-index: 5; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: calc(var(--panel-w) + 24px); display: flex; align-items: center; gap: 10px 14px; padding: 10px 12px 10px 16px; border-radius: 26px; min-height: 60px; }
:root { --panel-w: clamp(330px, 31vw, 440px); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
.brand .logo { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(145deg, #5ac8fa, #007aff 55%, #5e5ce6); box-shadow: 0 4px 14px rgba(0,122,255,0.4), inset 0 1px 0 rgba(255,255,255,0.4); }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div { min-width: 0; }
.ctrl { display: flex; align-items: center; gap: 8px; flex: none; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--fill); }
.seg button { border: 0; background: transparent; padding: 0 14px; min-height: 34px; border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); transition: background .2s, box-shadow .2s; }
.seg button[aria-pressed="true"] { background: var(--glass-2); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,0.16), 0 0 0 0.5px rgba(0,0,0,0.04); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: rgba(99,99,102,0.72); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: rgba(99,99,102,0.72); } }
.seg.small button { padding: 0 10px; font-size: 12.5px; min-height: 30px; font-variant-numeric: tabular-nums; }
.ibtn { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--fill); color: var(--ink); transition: background .2s, transform .1s; }
.ibtn:hover { background: var(--fill-2); } .ibtn:active { transform: scale(0.94); }
.ibtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
#play[aria-pressed="true"] { background: var(--fill); color: var(--ink); }
.vsep { width: 1px; height: 24px; background: var(--hair); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: var(--fill); padding: 0 18px; min-height: 44px; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--accent); transition: background .2s, transform .1s; }
.btn:hover { background: var(--fill-2); } .btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .38; cursor: default; }
/* iOS switch */
.tog { display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; min-height: 38px; }
.tog input { -webkit-appearance: none; appearance: none; flex: none; width: 46px; height: 28px; border-radius: 14px; background: var(--fill-2); position: relative; cursor: pointer; transition: background .25s; margin: 0; }
.tog input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.18), 0 1px 1px rgba(0,0,0,0.12); transition: transform .25s cubic-bezier(.3,1.4,.6,1); }
.tog input:checked { background: var(--green); } .tog input:checked::before { transform: translateX(18px); }
.tog.strong { color: var(--ink); font-weight: 600; }
/* sliders */
input[type="range"] { -webkit-appearance: none; appearance: none; height: 28px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(120,120,128,0.36); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(120,120,128,0.36); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.25), 0 0 0 0.5px rgba(0,0,0,0.06); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.25); }

/* ---------- panel ---------- */
#panel { position: fixed; z-index: 4; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: var(--panel-w); border-radius: 30px; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 24px; scrollbar-width: thin; }
.grab { display: none; }
.tabs { position: sticky; top: 0; z-index: 3; margin: 0 -16px 14px; padding: 14px 12px 12px; display: flex; flex-wrap: wrap; gap: 6px; background: linear-gradient(var(--glass-2), var(--glass-2)); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid var(--hair); border-radius: 30px 30px 0 0; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--fill); color: var(--ink-2); min-height: 34px; padding: 0 12px 0 10px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s, color .2s; }
.tabs button svg { flex: none; opacity: .85; }
.tabs button:hover { background: var(--fill-2); }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(0,122,255,0.35); }
#panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: none; margin: 18px 4px 8px; letter-spacing: 0; }
.lead { margin: 4px 4px 14px; color: var(--muted); font-size: 14px; line-height: 1.55; }
/* grouped cards */
.flowsec, .grp ul, .stages, #stagecard .pts, .rel, .o2row, .ledger, .simctl, .cmp { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; }
.flowsec { padding: 4px 14px 12px; margin-bottom: 18px; }
.flowsec h2 { margin: 12px 0 6px !important; }
.flow { display: flex; gap: 12px; align-items: center; padding: 10px 0; cursor: pointer; border-bottom: 1px solid var(--hair); }
.flow:last-of-type { border-bottom: 0; }
.flow input { -webkit-appearance: none; appearance: none; flex: none; order: 3; margin-left: auto; width: 46px; height: 28px; border-radius: 14px; background: var(--fill-2); position: relative; cursor: pointer; transition: background .25s; }
.flow input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.18); transition: transform .25s cubic-bezier(.3,1.4,.6,1); }
.flow input:checked { background: var(--green); } .flow input:checked::before { transform: translateX(18px); }
.sw { flex: none; width: 12px; height: 12px; border-radius: 4px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.ft { display: flex; flex-direction: column; min-width: 0; }
.ft b { font-size: 15px; font-weight: 600; }
.ft small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 11.5px; color: var(--ink-2); }
.keys span { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 6px; border-radius: 999px; background: var(--fill); }
.keys i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); display: inline-block; }
.grp h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 6px 8px; }
.grp ul { list-style: none; margin: 0; padding: 4px 0; display: block; overflow: hidden; }
.grp li + li .org { border-top: 1px solid var(--hair); }
.org { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; padding: 10px 14px; min-height: 52px; cursor: pointer; }
.org::after { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); opacity: .6; margin-left: 4px; }
.org:hover { background: var(--fill); }
.chip { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--c); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.18), 0 2px 6px color-mix(in srgb, var(--c) 40%, transparent); }
.chip.big { width: 52px; height: 52px; border-radius: 15px; }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 600; font-size: 15px; line-height: 1.3; }
.nm small, .en { font: 500 11.5px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--muted); letter-spacing: 0; margin: 0; }
.ct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.back { display: inline-flex; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--accent); font-weight: 500; font-size: 16px; padding: 8px 2px; min-height: 44px; cursor: pointer; margin: 0 0 0 -4px; }
.dhead { display: flex; gap: 14px; align-items: center; margin: 2px 0 12px; }
.dhead h2 { font-size: 26px !important; margin: 0 !important; line-height: 1.15; color: var(--ink) !important; font-weight: 700 !important; letter-spacing: -0.02em; }
.sum { margin: 0 0 14px; font-size: 16px; line-height: 1.55; color: var(--ink); }
.pts { margin: 0 0 16px; padding: 6px 0 !important; list-style: none; display: block; font-size: 14px; }
.pts li { padding: 10px 14px 10px 34px; position: relative; line-height: 1.55; }
.pts li + li { border-top: 1px solid var(--hair); }
.pts li::before { content: ""; position: absolute; left: 14px; top: 18px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.rel { padding: 12px 14px 8px; margin-bottom: 14px; }
.rel h3 { font-size: 12.5px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--fill); padding: 0 14px 0 10px; min-height: 36px; margin: 0 6px 6px 0; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; }
.fchip[aria-pressed="false"] { opacity: .5; }
.next { margin-top: 6px; width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; background: var(--fill); padding: 0 16px; min-height: 50px; border-radius: 14px; cursor: pointer; font-weight: 600; color: var(--accent); }
.next span { font: 600 12px/1 ui-monospace, Menlo, monospace; color: var(--muted); }
/* scenes */
.scene { margin: 0 0 16px; border-radius: 20px; overflow: hidden; background: #0b0f1a; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 26px rgba(0,0,0,0.28); }
.scene canvas { display: block; width: 100%; aspect-ratio: 120 / 72; image-rendering: pixelated; }
.scene figcaption { padding: 12px 16px 14px; font-size: 14px; line-height: 1.6; color: rgba(235,235,245,0.86); background: rgba(255,255,255,0.03); }
.scene figcaption b { color: #fff; font-size: 15px; }
.rscene .cvwrap { position: relative; }
.rscene canvas { display: block; width: 100%; image-rendering: pixelated; }
.lbls { position: absolute; inset: 0; pointer-events: none; }
.lbls span { position: absolute; transform: translate(-50%, -50%); font-size: 10.5px; line-height: 1; font-weight: 700; color: #fff; white-space: nowrap; padding: 3px 6px; border-radius: 999px; background: rgba(20,22,30,0.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.lbls span.l { transform: translate(0, -50%); } .lbls span.r { transform: translate(-100%, -50%); }
.lbls span.num { font-family: ui-monospace, Menlo, monospace; color: #ffd84d; }
.lbls span.dim { color: rgba(235,235,245,0.75); background: rgba(20,22,30,0.35); }
.lbls span.ca { color: #5fe0b8; } .lbls span.cb { color: #c8f060; } .lbls span.cc { color: #ffb060; }
.sctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.sctrl:empty { display: none; } .sctrl [hidden] { display: none !important; }
.sbtn, .sbtn2 { border: 0; background: rgba(118,118,128,0.28); color: #fff; padding: 0 14px; min-height: 36px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .2s; }
.sbtn:hover, .sbtn2:hover { background: rgba(118,118,128,0.4); }
.sbtn[aria-pressed="true"], .sbtn2[aria-pressed="true"] { background: var(--accent); color: #fff; }
.sctrl .tog { color: rgba(235,235,245,0.9); }
.rng, .rng2 { display: inline-flex; align-items: center; gap: 10px; color: rgba(235,235,245,0.85); font-size: 13px; font-weight: 500; flex: 1 1 200px; }
.rng input, .rng2 input { flex: 1; min-width: 90px; }
.scene figcaption .mini, .mini { display: block; margin-top: 6px; color: rgba(235,235,245,0.6); font-size: 12.5px; }
/* tours */
.stages { list-style: none; margin: 0 0 18px; padding: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.stages button { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; border: 0; background: transparent; border-radius: 12px; cursor: pointer; font-size: 13.5px; line-height: 1.25; font-weight: 500; color: var(--ink); }
.stages button:hover { background: var(--fill); }
.stages button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.stages .n, .stt .n { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; font: 700 12px/1 -apple-system, BlinkMacSystemFont, sans-serif; background: var(--fill-2); color: var(--ink); font-variant-numeric: tabular-nums; }
.stages button[aria-current="true"] .n { background: var(--accent); color: #fff; }
.stt { display: flex; align-items: center; gap: 12px; font-size: 24px !important; font-weight: 700 !important; color: var(--ink) !important; margin: 8px 0 2px !important; letter-spacing: -0.02em; }
.stt .n { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; background: var(--accent); color: #fff; }
.place { margin: 0 0 10px; color: var(--muted); font-size: 13px; font-weight: 500; }
.o2row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 6px 14px; margin-bottom: 14px; }
.note { font-size: 12.5px; color: #ff453a; }
.warn { background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.35); padding: 10px 14px; border-radius: 14px; font-size: 13.5px; margin: 0 0 12px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; }
.tally { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; }
.tally .tl { width: 100%; font-size: 12px; color: var(--muted); font-weight: 500; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; background: var(--fill); border-radius: 999px; font-size: 13px; }
.tchip i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.tchip b { font-weight: 700; font-variant-numeric: tabular-nums; }
.stnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
.stnav .btn { flex: 1; }
.ledger { padding: 14px; margin: 0 0 16px; }
.ledger .sbtn { background: var(--fill); color: var(--ink); }
.ledger .sbtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.shrow { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.mini2 { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.ltab { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 12px; }

// ===== Pixel cell painter (pure; no DOM) =====
const WW = 640, WH = 400;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function hash(x, y, s = 0) {
  let n = (x | 0) * 374761393 + (y | 0) * 668265263 + s * 1442695041;
  n = Math.imul(n ^ (n >>> 13), 1274126177); n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y, s = 0) => vnoise(x, y, s) * 0.6 + vnoise(x * 2.1, y * 2.1, s + 7) * 0.3 + vnoise(x * 4.3, y * 4.3, s + 13) * 0.1;
function rgb(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
const R = a => a.map(rgb);
function pick(ramp, t, x, y) {
  t = Math.max(0, Math.min(0.9999, t));
  const f = t * (ramp.length - 1); let i = Math.floor(f);
  if (f - i > bay(x, y)) i++;
  return ramp[Math.min(i, ramp.length - 1)];
}

  chl: R(['#1d5e22', '#26712a', '#2f8432', '#3a963a', '#47a843', '#5cba52', '#78cc66']),
  gran: R(['#0f4a17', '#155c1e', '#1d6f26', '#2a8430']),

// SD of rounded rectangle
function sdRR(px, py, x0, y0, x1, y1, r) {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, bx = (x1 - x0) / 2 - r, by = (y1 - y0) / 2 - r;
  const qx = Math.abs(px - cx) - bx, qy = Math.abs(py - cy) - by;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
}

class Painter {

  add(type, extra = {}) {
    const id = this.instances.length;

    return id;

  set(x, y, c, id) {

      if (y < o.miny) o.miny = y; if (y > o.maxy) o.maxy = y;

function forEll(cx, cy, rx, ry, ang, fn) {

      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const u = (dx * ca + dy * sa) / rx, v = (-dx * sa + dy * ca) / ry;
      const r = Math.sqrt(u * u + v * v);
      if (r <= 1) {
        const e = r < 1e-4 ? 99 : (1 - r) / r * Math.hypot(rx * u, ry * v);
        fn(x, y, u, v, r, e);

}

  return Math.max(0, Math.min(1, -0.42 * wx - 0.5 * wy + 0.76 * nz));
}

function paintCell(kind) {

function chainPath(pts, bend = 0.12) {

}

function tallyFor(i) {
  const sh = tour.shuttle === 'mal' ? 2.5 : 1.5;
  const t = [{ ATP: 2, NADH: 2, FADH2: 0, CO2: 0 }, { ATP: 2, NADH: 4, FADH2: 0, CO2: 2 }, { ATP: 4, NADH: 10, FADH2: 2, CO2: 6 }, { ATP: 4, NADH: 10, FADH2: 2, CO2: 6, note: 'NADH·FADH₂의 전자로 H⁺ 기울기 형성' }];
  if (i <= 3) return t[i];
  const ox = 2 * sh + 8 * 2.5 + 2 * 1.5;
  return { ATP: 4 + ox, NADH: 10, FADH2: 2, CO2: 6, used: true };
}

// ---------- tour control ----------
function enterStage(i) {
  const SS = curStages();
  i = Math.max(0, Math.min(SS.length - 1, i));
  tour.stage = i; tour.stages[tour.track] = i; tour.token++; tour.t = 0; tour.cyc = -1; clearTourAgents();
  const st = SS[i];
  tour.acc = (st.period || 1) * 0.85;
  divSim.on = tour.track === 'div'; if (divSim.on) divEnter(st);
  tour.T = tourTargets();
  if (tour.track === 'resp') { if (st.key === 'ferm') setO2(false); else if (i <= 5) setO2(true); }
  st.cam(tour.T);
  renderStageCard();
}
function setO2(v) {
  o2On = v; const b = document.getElementById('o2'); if (b) b.checked = v;
  const n = document.getElementById('o2note');
  if (n) n.textContent = v ? '' : '산소가 없어 전자전달사슬이 멈췄어요. 미토콘드리아가 어둡게 보여요.';
}
function tourStep(dt) {
  const st = curStages()[tour.stage], T = tour.T; if (!T) return;
  tour.t += dt;
  if (st.run) { tour.acc += dt; if (tour.acc >= st.period) { tour.acc -= st.period; st.run(T); } }
  if (st.tick) st.tick(dt, T);
}
function tourOverlay(ox, oy, s) {
  if (!world) return;
  if (!o2On) {
    ctx.fillStyle = 'rgba(8,10,20,0.5)';
    for (const m of world.P.instances) if (m.type === 'mitochondrion') { ctx.beginPath(); ctx.ellipse(ox + m.cx * s, oy + m.cy * s, m.rx * s, m.ry * s, m.ang, 0, Math.PI * 2); ctx.fill(); }
  }
  if (!lightOn && world.S.kind === 'plant') {
    ctx.fillStyle = 'rgba(4,6,18,0.55)';
    for (const m of world.P.instances) if (m.type === 'chloroplast') { ctx.beginPath(); ctx.ellipse(ox + m.cx * s, oy + m.cy * s, m.rx * s, m.ry * s, m.ang, 0, Math.PI * 2); ctx.fill(); }
  }
  if (!tour.active || !tour.T) return;
  const T = tour.T, st = curStages()[tour.stage];
  const ps = Math.max(2.6, Math.min(s, 7)), cps = Math.ceil(ps);
  const dotW = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(ox + (x + 0.5) * s - ps / 2), Math.round(oy + (y + 0.5) * s - ps / 2), cps, cps); };
  if (tour.track === 'photo') { photoOverlay(ox, oy, s, dotW, T, st); return; }
  if (['struct', 'div', 'gene', 'plant'].includes(tour.track)) return;
  if (st.key === 'cycle') {
    const M = T.M, idx = Math.floor(tour.t / 0.8) % 8, f = (tour.t / 0.8) % 1;
    for (let k = 0; k < 64; k++) { const a = k / 64 * Math.PI * 2; const p = mloc(M, Math.cos(a) * M.rx * 0.55, Math.sin(a) * M.ry * 0.55); if (k % 2 === 0) dotW(Math.round(p.x), Math.round(p.y), 'rgba(255,255,255,0.35)'); }
    for (let k = 0; k < 8; k++) { const a = (-90 + 45 * k) * Math.PI / 180; const p = mloc(M, Math.cos(a) * M.rx * 0.55, Math.sin(a) * M.ry * 0.55); dotW(Math.round(p.x), Math.round(p.y), k === idx ? '#ffffff' : '#8b2d0c'); }
    const a = (-90 + 45 * (idx - 1 + f)) * Math.PI / 180, p = mloc(M, Math.cos(a) * M.rx * 0.55, Math.sin(a) * M.ry * 0.55);
    ctx.globalAlpha = 1; const cx = Math.round(p.x), cy = Math.round(p.y);
    dotW(cx, cy, '#ff4f4f'); dotW(cx + 1, cy, '#ff4f4f'); dotW(cx, cy + 1, '#c22'); dotW(cx + 1, cy + 1, '#c22');
  }
  if (st.key === 'glyco' || st.key === 'ferm' || st.key === 'reg') {
    const r = 5 + 2 * Math.sin(tour.t * 3), n = 22;
    ctx.globalAlpha = 0.6;
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; dotW(Math.round(T.X.x + Math.cos(a) * r), Math.round(T.X.y + Math.sin(a) * r), st.key === 'reg' ? '#a58bff' : '#ffe066'); }
    ctx.globalAlpha = 1;
  }
}

// ---------- scene kit ----------
function fitLabels(box) {
  const B = box.getBoundingClientRect(); if (!B.width) return; const placed = [];
  box.querySelectorAll('span').forEach(sp => {
    sp.style.marginLeft = '0px'; sp.style.marginTop = '0px';
    let r = sp.getBoundingClientRect(), dx = 0, dy = 0;
    if (r.left < B.left + 2) dx = B.left + 2 - r.left; if (r.right + dx > B.right - 2) dx = B.right - 2 - r.right;
    if (r.top < B.top + 2) dy = B.top + 2 - r.top; if (r.bottom + dy > B.bottom - 2) dy = B.bottom - 2 - r.bottom;
    let rect = { l: r.left + dx, t: r.top + dy, r: r.right + dx, b: r.bottom + dy };
    for (let k = 0; k < 6; k++) { const hit = placed.find(p => rect.l < p.r && rect.r > p.l && rect.t < p.b && rect.b > p.t); if (!hit) break; const shift = (rect.t + rect.b) / 2 < (hit.t + hit.b) / 2 ? hit.t - rect.b - 1 : hit.b - rect.t + 1; if (rect.t + shift < B.top || rect.b + shift > B.bottom) break; dy += shift; rect.t += shift; rect.b += shift; }
    placed.push(rect); sp.style.marginLeft = dx + 'px'; sp.style.marginTop = dy + 'px';
  });
}
window.addEventListener('resize', () => document.querySelectorAll('.lbls').forEach(fitLabels));
function kit(box, W, H, opts = {}) {

      K.wait(2.6, () => { setSub(3); K.mv('coa', [[154, 30], [122, 42]], 0.8, () => K.mv('acoa', [[126, 52], [156, 72]], 1.2, null, true)); });

// ---- 3. citric acid cycle ----
const CYC = [
  { m: '옥살로아세트산', e: '', c: 'gggg', d: '회로의 출발점이자 도착점인 탄소 4개 분자예요.' },
  { m: '시트르산', e: '시트르산 합성효소', c: 'rrgggg', d: '아세틸 CoA의 아세틸기(빨강 2개)가 옥살로아세트산에 붙고 CoA는 떨어져 나가요.' },
  { m: '아이소시트르산', e: '아코니테이스', c: 'rrgggg', d: '물이 빠졌다가 다시 붙으며 이성질체로 바뀌어요.' },
  { m: 'α-케토글루타르산', e: '아이소시트르산 탈수소효소', c: 'rrggg', d: '산화되며 NAD⁺가 NADH가 되고, CO₂ 1개가 빠져나가요.' },
  { m: '숙시닐 CoA', e: 'α-케토글루타르산 탈수소효소', c: 'rrgg', d: '또 CO₂가 빠지고 NADH가 생겨요. 남은 분자에 CoA가 붙어요.' },
  { m: '숙신산', e: '숙시닐 CoA 합성효소', c: 'rrgg', d: 'CoA가 인산기로 바뀌고, 인산기가 GDP로 넘어가 GTP가 돼요. GTP는 ATP를 만들 수 있어요.' },
  { m: '푸마르산', e: '숙신산 탈수소효소', c: 'rrgg', d: '수소 원자 2개가 FAD로 가서 FADH₂가 돼요. 이 효소만 내막에 박혀 있어요(복합체 Ⅱ).' },
  { m: '말산', e: '푸마레이스', c: 'rrgg', d: '물이 더해져 결합이 재배열돼요.' },
  { m: '옥살로아세트산', e: '말산 탈수소효소', c: 'rrgg', d: '산화되며 NADH가 생기고 옥살로아세트산이 다시 만들어져요. 다음 바퀴에서는 이 빨간 탄소들이 CO₂로 나갈 수 있어요.' },
];
function sceneCycle(box) {
  const K = kit(box, 160, 96, { alt: '시트르산 회로 8단계를 도는 애니메이션' });
  matrixBg(K);
  const CXc = 80, CYc = 48, Rr = 34;
  const stp = i => { const a = (-90 + 45 * (i - 1)) * Math.PI / 180; return [CXc + Math.cos(a) * Rr, CYc + Math.sin(a) * Rr * 0.95]; };
  for (let k = 0; k < 140; k++) { const a = k / 140 * Math.PI * 2; if (k % 3) K.put(Math.round(CXc + Math.cos(a) * Rr), Math.round(CYc + Math.sin(a) * Rr * 0.95), '#7a2a08'); }
  let step = 0, phase = 0, auto = true, turns = 0; const DUR = 2.4;
  const tally = { NADH: 0, FADH2: 0, ATP: 0, CO2: 0 };
  const startStep = () => {
    phase = 0; K.movers.length = 0; K.timers.length = 0;
    const s = step, [px, py] = stp(s === 0 ? 8 : s), o = [(px - CXc) * 0.5 + px, (py - CYc) * 0.5 + py];
    const out = (sp, d = 0) => K.wait(d + 0.9, () => K.mv(sp, [[px, py], o], 1.1, null, true));
    if (s === 1) { K.mv('acoa', [[6, 4], stp(1)], 0.9, () => K.mv('coa', [stp(1), [150, 6]], 1.0, null, true)); }
    if (s === 2) { out('h2o'); }
    if (s === 3 || s === 4) { out('co2'); out('nadh', 0.25); }
    if (s === 5) out('atp');
    if (s === 6) out('fadh2');
    if (s === 7) K.mv('h2o', [o, [px, py]], 0.9);
    if (s === 8) out('nadh');
    render();
  };
  const render = () => {
    const s = CYC[step];
    K.cap.innerHTML = `<b>${step === 0 ? '출발' : step + '단계'}${s.e ? ', ' + s.e : ''}</b><br>${s.m}(탄소 ${s.c.length}개). ${s.d}<span class="mini">이번 바퀴: NADH ${tally.NADH} · FADH₂ ${tally.FADH2} · ATP ${tally.ATP} · CO₂ ${tally.CO2}</span>`;
    const [lx, ly] = stp(step === 0 ? 8 : step);
    K.labels([{ x: CXc, y: CYc - 13, t: s.m }, { x: lx + (lx > CXc ? 6 : -6), y: ly, t: String(step === 0 ? '' : step), c: lx > CXc ? 'l num' : 'r num' }]);
    const b = K.ctrl.querySelector('[data-i="2"]'); if (b) b.setAttribute('aria-pressed', String(auto));
  };
  const apply = () => { const s = step; if (s === 3 || s === 4) { tally.CO2++; tally.NADH++; } if (s === 8) tally.NADH++; if (s === 5) tally.ATP++; if (s === 6) tally.FADH2++; };
  const go = () => { step = step === 8 ? 1 : step + 1; if (step === 1) { Object.keys(tally).forEach(k => tally[k] = 0); turns++; } apply(); startStep(); };
  K.buttons([
    { t: '이전', fn: () => { step = Math.max(0, step - 1); startStep(); } },
    { t: '다음', fn: () => go(1) },
    { t: '자동 재생', pressed: auto, fn: () => { auto = !auto; render(); } },
  ]);
  startStep();
  return {
    step(dt) { K.tick(dt); phase += dt; if (auto && phase > DUR) go(1); },
    draw() {
      K.flush();
      for (let i = 1; i <= 8; i++) { const [x, y] = stp(i); K.pat(x, y, ['.a.', 'aaa', '.a.'], { a: i === step ? '#ffffff' : '#8b2d0c' }); }
      if (step > 0) { const a = (-90 + 45 * (step - 2 + Math.min(1, phase / 0.9))) * Math.PI / 180; K.pat(CXc + Math.cos(a) * Rr, CYc + Math.sin(a) * Rr * 0.95, ['aa', 'aa'], { a: '#ff3b3b' }); }
      const cols = CYC[step].c; const n = cols.length, x0 = CXc - (n - 1) * 3.5;
      for (let k = 0; k < n - 1; k++) K.line(x0 + k * 7, CYc + 2, x0 + (k + 1) * 7, CYc + 2, '#3a1a08', true);
      for (let k = 0; k < n; k++) K.bead(Math.round(x0 + k * 7), CYc + 2, cols[k], true);
      if (step === 4) K.pat(x0 + n * 7 + 2, CYc + 2, ['aa', 'aa'], { a: '#38c9bb' });
      K.drawMovers();
    }
  };
}

// ---- 4. electron transport chain ----
function sceneEtc(box) {
  const K = kit(box, 160, 96, { alt: '전자가 운반체를 따라 에너지 계단을 내려가는 그림' });
  const Y = G => Math.round(86 - G * 1.45);
  K.bg((x, y) => (x % 2 === 0 && y % 12 === 2) ? '#1c2440' : pick(R(['#0f1428', '#121830', '#141b36']), 0.4 + 0.3 * fbm(x / 12, y / 12, 2), x, y));
  for (let y = 4; y <= 88; y++) K.put(6, y, '#4a5677');
  const C = { NADH: [10, 50], FMN: [18, 46], FS1: [28, 42], FADH2: [42, 40], FS2: [48, 35], Q: [58, 31], b: [68, 28], FS3: [78, 26], c1: [88, 23], c: [100, 20], a: [114, 15], a3: [126, 12], O2: [148, 0] };
  const blobAt = (x0, x1, g0, g1, ramp) => { const cx = (x0 + x1) / 2, cy = (Y(g0) + Y(g1)) / 2; K.blob(cx, cy, (x1 - x0) / 2 + 4, Math.abs(Y(g1) - Y(g0)) / 2 + 5, ramp, '#141032'); };
  blobAt(15, 31, 48, 40, ['#3d3477', '#4e4396', '#6a5cbf', '#8f82dd']);
  blobAt(40, 50, 39, 33, ['#3a5a7a', '#4a7096', '#6390ba']);
  blobAt(66, 90, 30, 21, ['#3d3477', '#4e4396', '#6a5cbf', '#8f82dd']);
  blobAt(112, 128, 17, 10, ['#3d3477', '#4e4396', '#6a5cbf', '#8f82dd']);
  for (const [k, [x, g]] of Object.entries(C)) { if (k === 'O2') continue; K.patS(x, Y(g), ['.aa.', 'abba', 'abba', '.aa.'], { a: k === 'NADH' ? '#ff9a3c' : k === 'FADH2' ? '#ffd23c' : '#c9d6ff', b: k === 'NADH' ? '#ffd2a8' : k === 'FADH2' ? '#fff0a0' : '#ffffff' }); }
  K.patS(C.O2[0], Y(0), ['aa'], { a: '#e8164a' });
  const L = [
    { x: 14, y: Y(50) - 5, t: 'NADH', c: 'l' }, { x: 18, y: Y(46) + 9, t: 'FMN' }, { x: 33, y: Y(47), t: 'Ⅰ', c: 'num' }, { x: 54, y: Y(39) - 1, t: 'Ⅱ', c: 'num' },
    { x: 42, y: Y(40) + 9, t: 'FADH₂' }, { x: 56, y: Y(31) + 8, t: 'Q' }, { x: 78, y: Y(33) - 3, t: 'Ⅲ', c: 'num' }, { x: 68, y: Y(28) + 8, t: 'Cyt b' },
    { x: 100, y: Y(20) + 8, t: 'Cyt c' }, { x: 120, y: Y(20) - 2, t: 'Ⅳ', c: 'num' }, { x: 126, y: Y(12) + 8, t: 'Cyt a₃' }, { x: 146, y: Y(0) - 6, t: 'O₂' },
    { x: 156, y: 6, t: '자유에너지 높음 ↑', c: 'r dim' }, { x: 9, y: 91, t: '에너지 낮음', c: 'l dim' },
  ];
  K.labels(L);
  let pumped = 0, busy = false, last = '';
  const pumpAt = (x, n) => { pumped += n; for (let k = 0; k < Math.min(n, 4); k++) K.wait(k * 0.12, () => K.mv('h', [[x + rnd(-3, 3), 40], [x + rnd(-4, 4), 2]], 0.9, null, true)); };
  const send = src => {
    if (busy) return; busy = true; pumped = 0; last = src;
    const path = src === 'NADH' ? ['NADH', 'FMN', 'FS1', 'Q', 'b', 'FS3', 'c1', 'c', 'a', 'a3', 'O2'] : ['FADH2', 'FS2', 'Q', 'b', 'FS3', 'c1', 'c', 'a', 'a3', 'O2'];
    const hop = i => {
      if (i >= path.length - 1) { K.mv('h2o', [[148, Y(0)], [152, 92]], 1.0, null, true); busy = false; caption(true); return; }
      if (path[i + 1] === 'O2' && !o2On) { busy = false; caption(false, true); return; }
      const a = C[path[i]], b = C[path[i + 1]];
      K.mv('e', [[a[0], Y(a[1])], [b[0], Y(b[1])]], 0.42, () => {
        if (path[i] === 'FS1' && path[i + 1] === 'Q') pumpAt(24, 4);
        if (path[i] === 'c1' && path[i + 1] === 'c') pumpAt(78, 4);
        if (path[i] === 'a3') pumpAt(120, 2);
        caption(false); hop(i + 1);
      });
    };
    hop(0);
  };
  const caption = (done, stuck) => {
    K.cap.innerHTML = stuck
      ? `<b>전자가 멈췄어요</b><br>O₂가 없으면 마지막 운반체 Cyt a₃가 전자를 넘길 곳이 없어 사슬 전체가 막혀요. H⁺도 더 퍼내지 못해요.`
      : `<b>${last || 'NADH'}의 전자 2개</b><br>전자쌍이 운반체를 하나씩 거치며 에너지 계단을 내려가요. 복합체 Ⅰ·Ⅲ·Ⅳ를 지날 때마다 H⁺(빨강)를 막사이 공간으로 퍼내요.<span class="mini">퍼낸 H⁺ ${pumped}개 ≈ ATP ${(pumped / 4).toFixed(1)}개 (H⁺ 4개당 ATP 1개)${done ? ' · 마지막에 O₂가 받아 물이 됐어요' : ''}</span>`;
  };
  K.buttons([
    { t: 'NADH 전자 보내기', fn: () => send('NADH') },
    { t: 'FADH₂ 전자 보내기', fn: () => send('FADH2') },
    { t: '막 단면 보기', fn: () => { respScene = membraneView(box); } },
  ]);
  caption(false); send('NADH');
  let idle = 0;
  return { step(dt) { K.tick(dt); if (!busy) { idle += dt; if (idle > 3.5) { idle = 0; send(last === 'NADH' ? 'FADH2' : 'NADH'); } } }, draw() { K.flush(); K.drawMovers(); } };
}
function membraneView(box) {
  box.innerHTML = `<figure class="scene"><canvas width="120" height="72" role="img" aria-label="크리스타 내막 단면 애니메이션"></canvas><div class="sctrl"><button class="sbtn" id="backstair">에너지 계단 보기</button></div><figcaption></figcaption></figure>`;
  box.querySelector('#backstair').onclick = () => { respScene = sceneEtc(box); };
  const sc = makeScene('mito', box.querySelector('canvas'), box.querySelector('figcaption'));
  return sc;
}

// ---- 5. ATP synthase ----
function sceneAtps(box) {
  const K = kit(box, 160, 96, { alt: 'ATP 합성효소가 H⁺ 흐름으로 회전하며 ATP를 만드는 애니메이션' });
  K.bg((x, y) => {
    if (y < 34) return pick(R(['#f1bd88', '#f6c99a', '#fad6ae']), 0.3 + 0.5 * fbm(x / 9, y / 9, 3), x, y);
    if (y < 36 || (y >= 48 && y < 50)) return (x & 1) ? '#c2501a' : '#a8441a';
    if (y < 48) return (x & 1) ? '#e3bf88' : '#d4a96e';
    return pick(R(['#d9763a', '#e9874a', '#f09858']), 0.3 + 0.5 * fbm(x / 9, y / 9, 5), x, y);
  });
  K.blob(106, 41, 9, 9, ['#4a2a6a', '#6a3d94', '#8f5fc0', '#b58ae0'], '#1f1030');
  K.rect(108, 48, 111, 80, '#6a3d94'); K.rect(112, 48, 112, 80, '#3a1f56'); K.rect(96, 79, 112, 81, '#6a3d94');
  let grad = 0.7, leak = false, rot = 0, rotT = 0, made = 0, heat = 0, acc = 0, hAcc = 0;
  const pool = []; for (let i = 0; i < 20; i++) pool.push({ x: rnd(4, 156), y: rnd(3, 31) });
  K.ctrl.innerHTML = `<label class="rng">H⁺ 농도 기울기<input type="range" min="0" max="100" value="70" id="gradr"></label><label class="tog"><input type="checkbox" id="leakc">비짝물림 단백질</label>`;
  K.ctrl.querySelector('#gradr').oninput = e => { grad = e.target.value / 100; };
  K.ctrl.querySelector('#leakc').onchange = e => { leak = e.target.checked; };
  const caption = () => { K.cap.innerHTML = `<b>H⁺ 흐름이 돌리는 분자 모터</b><br>H⁺가 고정자 통로로 들어가 회전자에 붙으면 회전자가 돌고, 내부축이 촉매마디를 비틀어 ADP + Pᵢ를 ATP로 합쳐요.${leak ? ' 비짝물림 단백질(왼쪽 통로)로 새는 H⁺는 열만 내요.' : ''}${!o2On ? ' 산소가 없어 기울기가 다시 채워지지 않아요.' : ''}<span class="mini">만든 ATP ${made}개${leak ? ` · 열로 사라진 H⁺ ${heat}개` : ''}</span>`; };
  K.labels([{ x: 4, y: 6, t: '막사이 공간 (H⁺ 많음)', c: 'l dk' }, { x: 4, y: 90, t: '기질', c: 'l dk' }, { x: 124, y: 38, t: '고정자', c: 'l dk' }, { x: 72, y: 30, t: '회전자', c: 'dk' }, { x: 80, y: 60, t: '내부축', c: 'l dk' }, { x: 72, y: 92, t: '촉매마디', c: 'dk' }]);
  const target = () => (o2On ? 4 + grad * 26 : Math.max(0, pool.length));
  const sendOne = () => {
    if (!pool.length) return;
    const i = Math.floor(Math.random() * pool.length), p = pool.splice(i, 1)[0];
    if (leak && Math.random() < 0.55) {
      K.mv('h', [[p.x, p.y], [22, 30], [22, 52], [22 + rnd(-4, 4), 62]], 0.9, () => { heat++; K.mv('heat', [[22, 62], [22 + rnd(-8, 8), 78]], 0.8, null, true); caption(); });
      return;
    }
    K.mv('h', [[p.x, p.y], [100, 30], [96, 38], [86, 44], [62, 44], [52, 50], [52, 62]], 1.4, () => {
      rotT += Math.PI * 2 / 10; acc += 0.3;
      if (acc >= 1) { acc -= 1; K.mv('adp', [[154, 70], [90, 76]], 0.6, () => K.mv('atp', [[90, 82], [150, 92]], 1.2, () => { made++; caption(); }, true)); }
      K.mv('h', [[52, 62], [52 + rnd(-8, 8), 92]], 0.8, null, true);
    });
  };
  caption();
  return {
    step(dt) {
      K.tick(dt); rot += (rotT - rot) * Math.min(1, dt * 5);
      if (o2On && pool.length < target()) { hAcc += dt * 6; while (hAcc > 1) { hAcc--; pool.push({ x: rnd(4, 156), y: rnd(3, 31) }); } }
      if (pool.length > 4 && grad > 0.02) { const rate = 0.6 + grad * 3.4; if (Math.random() < rate * dt) sendOne(); }
      for (const p of pool) { p.x = Math.max(2, Math.min(157, p.x + (Math.random() - 0.5) * 40 * dt)); p.y = Math.max(2, Math.min(31, p.y + (Math.random() - 0.5) * 40 * dt)); }
      while (pool.length > 4 + grad * 26 + 2) pool.pop();
    },
    draw() {
      K.flush();
      const off = rot / (Math.PI * 2) * 20;
      for (let y = 34; y <= 50; y++) for (let x = 48; x <= 96; x++) {
        const u = (x + 0.5 - 72) / 24, v = (y + 0.5 - 42) / 8.5, r = Math.hypot(u, v); if (r > 1) continue;
        K.dot(x, y, r > 0.88 ? '#1a2050' : (((((x - off) % 4) + 4) % 4) < 1 ? '#2f3c8a' : (v < -0.3 ? '#8aa0f0' : '#5a6fd0')));
      }
      for (let y = 50; y <= 66; y++) { K.dot(71, y, '#3a2a6a'); K.dot(72, y, '#6a5ab0'); K.dot(73, y, '#3a2a6a'); }
      for (let y = 66; y <= 88; y++) for (let x = 52; x <= 92; x++) {
        const u = (x + 0.5 - 72) / 20, v = (y + 0.5 - 77) / 11, r = Math.hypot(u, v); if (r > 1) continue;
        const seg = Math.floor(((Math.atan2(v, u) + Math.PI) / (Math.PI / 3))) % 2;
        K.dot(x, y, r > 0.9 ? '#6a4a10' : (seg ? '#f2c55c' : '#d9a43a'));
      }
      const gx = Math.cos(rot) * 7, gy = Math.sin(rot) * 3.5;
      for (let k = -1; k <= 1; k += 0.25) K.dot(72 + gx * k, 77 + gy * k, '#6a3a0a');
      if (leak) { K.rect(19, 34, 25, 49, '#6aa36a', true); K.rect(21, 34, 23, 49, '#1e3a1e', true); }
      for (const p of pool) SPS.h(K, p.x, p.y);
      K.drawMovers();
    }
  };
}

// ---- 6. ledger ----

  const seg = (n, c, lab) => `<span class="seg2" style="--c:${c};flex:${n}" title="${lab}"></span>`;

  const upd = () => {

  };

function granaOf(C) { const n = Math.max(3, Math.round(C.rx / 8)); const out = []; for (let g = 0; g < n; g++) out.push(-C.rx * 0.68 + (2 * C.rx * 0.68) * g / (n - 1)); return out; }
function wl2rgb(w) {
  let r = 0, g = 0, b = 0;
  if (w < 440) { r = -(w - 440) / 60; b = 1; } else if (w < 490) { g = (w - 440) / 50; b = 1; } else if (w < 510) { g = 1; b = -(w - 510) / 20; }
  else if (w < 580) { r = (w - 510) / 70; g = 1; } else if (w < 645) { r = 1; g = -(w - 645) / 65; } else { r = 1; }
  const f = w < 420 ? 0.4 + 0.6 * (w - 380) / 40 : w > 680 ? 0.4 + 0.6 * (750 - w) / 70 : 1;
  const h = v => Math.round(255 * Math.pow(Math.max(0, v * f), 0.8)).toString(16).padStart(2, '0');
  return '#' + h(r) + h(g) + h(b);
}
const gau = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));

const absB = w => Math.min(1, 1.0 * gau(w, 455, 13) + 0.5 * gau(w, 643, 10) + 0.15 * gau(w, 600, 15));
const absC = w => Math.min(1, 0.6 * gau(w, 425, 15) + 0.85 * gau(w, 450, 13) + 0.75 * gau(w, 480, 12));
const action = w => { let v = 0.22 + 0.55 * Math.max(absA(w), 0.85 * absB(w), 0.7 * absC(w)) + 0.15 * absA(w); if (w > 680) v *= Math.max(0, 1 - (w - 680) / 22); if (w < 400) v *= 0.6; return Math.min(1, v); };

function photoOverlay(ox, oy, s, dotW, T, st) {
  if (!T.C) return;
  if (st.key === 'calvin') {
    const C = T.C, idx = Math.floor(tour.t / 1.0) % 5, f = (tour.t / 1.0) % 1;
    for (let k = 0; k < 64; k += 2) { const a = k / 64 * Math.PI * 2; const p = cloc(C, Math.cos(a) * C.rx * 0.55, Math.sin(a) * C.ry * 0.5); dotW(Math.round(p.x), Math.round(p.y), 'rgba(170,220,255,0.55)'); }
    for (let k = 0; k < 5; k++) { const a = (-90 + 72 * k) * Math.PI / 180; const p = cloc(C, Math.cos(a) * C.rx * 0.55, Math.sin(a) * C.ry * 0.5); dotW(Math.round(p.x), Math.round(p.y), k === idx ? '#ffffff' : '#1d4d7a'); }
    const a = (-90 + 72 * (idx - 1 + f)) * Math.PI / 180, p = cloc(C, Math.cos(a) * C.rx * 0.55, Math.sin(a) * C.ry * 0.5);
    dotW(Math.round(p.x), Math.round(p.y), '#4fb3ff'); dotW(Math.round(p.x) + 1, Math.round(p.y), '#4fb3ff');
  }
}

// 1. leaf / chloroplast
function scLeaf(box) {
  const K = kit(box, 160, 100, { alt: '잎 단면과 엽록체 구조 그림' });
  let view = 'leaf', open = true;
  const drawLeaf = () => K.bg((x, y) => {
    const vein = ((x - 124) / 18) ** 2 + ((y - 54) / 12) ** 2;
    if (vein <= 1) { const r = Math.sqrt(vein); if (r > 0.85) return '#8fbf6a'; return y < 54 ? (((x + y) % 4 === 0) ? '#2a3a7a' : '#5a6ab0') : (((x * 3 + y) % 5 === 0) ? '#5a2a6a' : '#a06ab0'); }
    if (y < 8 || y > 76) return pick(R(['#0b1322', '#0e1626']), 0.5, x, y);
    if (y <= 12 || (y >= 71 && y <= 75)) {
      if (y >= 71 && x >= 53 && x <= 67) { const gl = ((x - 57) / 4) ** 2 + ((y - 73) / 2.6) ** 2 <= 1, gr = ((x - 63) / 4) ** 2 + ((y - 73) / 2.6) ** 2 <= 1; if ((gl || gr) && !(open && x >= 59 && x <= 61)) return (gl && x > 59) || (gr && x < 61) ? '#2f6a2a' : '#8fd06a'; return '#0e1626'; }
      return (x % 10 === 0 || y === 8 || y === 12 || y === 71 || y === 75) ? '#6f8f5a' : '#b9d99a';
    }
    if (y <= 38) { const cx = x % 8; if (cx === 0 || y === 13 || y === 38) return '#3f6f2a'; if ((cx === 1 || cx === 7) && hash(x, y, 3) < 0.55) return '#6fd05a'; return '#2a5a26'; }
    if (x > 50 && x < 70 && y > 60) return '#16261e';
    const f = fbm(x / 7, y / 6, 12); if (f < 0.44) return '#16261e'; if (f < 0.49) return '#3f6f2a'; if (hash(x, y, 4) < 0.1) return '#6fd05a'; return '#2a5a26';
  });
  const drawChl = () => K.bg((x, y) => {
    const u = (x + 0.5 - 80) / 74, v = (y + 0.5 - 50) / 44, r = Math.hypot(u, v);
    if (r > 1) return pick(R(['#1a2a30', '#1e3038']), 0.5, x, y);
    const e = (1 - r) * 44;
    if (e < 1.5) return '#0c3311'; if (e < 3) return '#9fdc8a'; if (e < 4.2) return '#1a5a20';
    for (const gx of [28, 54, 80, 106, 132]) {
      const hh = 16 - Math.abs(gx - 80) * 0.12;
      if (Math.abs(x - gx) <= 8 && Math.abs(y - 50) <= hh) { const q = ((y - 50 + 100) % 4); if (q === 3) return '#062a0b'; if (Math.abs(x - gx) > 7) return '#0f4415'; return q === 1 ? '#5fc05a' : '#1d6f26'; }
    }
    if (Math.abs(y - 44 - 2 * Math.sin(x * 0.2)) < 0.6 || Math.abs(y - 58 + 2 * Math.sin(x * 0.25)) < 0.6) return '#8fdc6a';
    const sx = (x - 93) / 6, sy = (y - 76) / 4; if (sx * sx + sy * sy < 1) return (Math.floor(Math.hypot(sx, sy) * 4) % 2) ? '#e0d9a8' : '#f4efc8';
    if (hash(x, y, 9) < 0.02) return '#1d5e22';
    return pick(PAL.chl, 0.45 + 0.35 * fbm(x / 8, y / 8, 4), x, y);
  });
  const setView = v => {
    view = v; K.movers.length = 0; K.timers.length = 0;
    if (v === 'leaf') {
      drawLeaf();
      K.labels([{ x: 3, y: 4, t: '잎 윗면', c: 'l dim' }, { x: 3, y: 10, t: '표피', c: 'l' }, { x: 3, y: 25, t: '엽육세포 (울타리 모양)', c: 'l' }, { x: 3, y: 56, t: '엽육세포와 공기 공간', c: 'l' }, { x: 124, y: 38, t: '잎맥' }, { x: 60, y: 82, t: '기공' }, { x: 140, y: 82, t: '초록 점 = 엽록체', c: 'r dim' }]);
      K.cap.innerHTML = `<b>잎의 단면</b><br>기공으로 CO₂(회색)가 들어와 공기 공간을 지나 엽육세포로 가고, O₂(빨강)는 반대로 나가요. 잎맥(관다발)의 위쪽 물관으로 물이 들어오고, 아래쪽 체관으로 당이 실려 나가요.${open ? '' : ' 기공이 닫혀 기체 교환과 물 손실이 줄었어요.'}`;
    } else {
      drawChl();
      K.labels([{ x: 18, y: 12, t: '외막', c: 'l' }, { x: 150, y: 12, t: '내막', c: 'r' }, { x: 28, y: 30, t: '그라나' }, { x: 132, y: 30, t: '틸라코이드' }, { x: 80, y: 88, t: '스트로마' }, { x: 112, y: 72, t: '녹말 입자', c: 'l' }, { x: 54, y: 72, t: '틸라코이드 공간 (밝은 줄)' }]);
      K.cap.innerHTML = `<b>엽록체 구조</b><br>외막과 내막 사이에 좁은 막사이 공간이 있어요. 안쪽의 스트로마에 틸라코이드 더미(그라나)가 떠 있고, 그라나끼리는 스트로마 라멜라로 이어져요. 그라나 속 밝은 줄이 틸라코이드 공간이에요.`;
    }
    K.ctrl.querySelectorAll('[data-i]').forEach((b, i) => { if (i < 2) b.setAttribute('aria-pressed', String((i === 0) === (v === 'leaf'))); });
  };
  K.buttons([{ t: '잎 단면', pressed: true, fn: () => setView('leaf') }, { t: '엽록체 구조', pressed: false, fn: () => setView('chl') }, { t: '기공 열기·닫기', fn: () => { open = !open; if (view === 'leaf') setView('leaf'); } }]);
  setView('leaf');
  const loop = () => {
    if (view === 'leaf') {
      if (open) { const tx = rnd(30, 100), ty = rnd(44, 60); K.mv('co2', [[60, 96], [60, 74], [60, 64], [tx, ty]], 2.2); K.wait(0.6, () => K.mv('o2', [[rnd(30, 100), rnd(44, 60)], [60, 64], [60, 74], [60, 98]], 2.2, null, true)); }
      K.mv('h2o', [[118, 50], [100, 34], [rnd(20, 90), rnd(18, 34)]], 2.0, null, true);
      K.mv('suc', [[rnd(70, 100), rnd(18, 34)], [124, 60]], 1.8, null, true);
    }
    K.wait(1.4, loop);
  };
  loop();
  return { step(dt) { K.tick(dt); }, draw() { K.flush(); K.drawMovers(); } };
}

// 7. Calvin cycle
const CAL = [

  { n: '2단계 환원 (인산화)', m: '1,3-이인산글리세르산', c: 3, ps: [0, 2], k: 6, d: 'ATP 6개가 인산기를 하나씩 넘겨 1,3-이인산글리세르산 6개가 돼요.', C: 18, atp: 6 },
  { n: '2단계 환원', m: 'G3P', c: 3, ps: [2], k: 6, d: 'NADPH 6개가 전자를 주어 G3P 6개로 환원해요. 인산기 하나씩은 떨어져 나가요.', C: 18, nadph: 6 },
  { n: '배출', m: 'G3P', c: 3, ps: [2], k: 5, d: 'G3P 1개(탄소 3개)가 회로를 빠져나가 포도당과 다른 유기물의 재료가 돼요. 이것이 광합성의 순수한 산물이에요.', C: 15 },

];
function scCalvin(box) {
  const K = kit(box, 160, 100, { alt: '캘빈 회로의 세 단계를 탄소 구슬로 보여 주는 그림' });
  K.bg((x, y) => pick(R(['#3f9a3d', '#4aa846', '#57b552']), 0.25 + 0.4 * fbm(x / 10, y / 10, 7), x, y));
  const CX = 80, CY = 50, RR = 34;
  const arcs = [[-60, 60, '#9fd8ff'], [60, 170, '#5aa8e0'], [170, 300, '#2f78b8']];
  for (const [a0, a1, c] of arcs) for (let a = a0; a <= a1; a += 0.8) { const r = a * Math.PI / 180; for (let w = -1; w <= 1; w++) K.put(Math.round(CX + Math.cos(r) * (RR + w)), Math.round(CY + Math.sin(r) * (RR + w) * 0.92), c); }
  const ST = [210, 330, 30, 90, 120, 210];
  const at = (deg, rr = RR) => { const r = deg * Math.PI / 180; return [CX + Math.cos(r) * rr, CY + Math.sin(r) * rr * 0.92]; };
  K.labels([{ x: 116, y: 6, t: '1단계 탄소 고정', c: 'l dk' }, { x: 120, y: 92, t: '2단계 환원', c: 'l dk' }, { x: 2, y: 92, t: '3단계 RuBP 재생', c: 'l dk' }, { x: 104, y: 22, t: '루비스코', c: 'l' }]);
  let step = 0, auto = true, phase = 0; const tot = { co2: 0, atp: 0, nadph: 0, g3p: 0 };
  const go = s => {
    step = s; phase = 0; K.movers.length = 0; K.timers.length = 0; const d = CAL[s];
    if (s === 1) { for (let k = 0; k < 3; k++) K.wait(k * 0.2, () => K.mv('co2', [[100 + k * 6, 0], at(330, RR - 4)], 0.9)); tot.co2 += 3; }
    if (s === 2) { for (let k = 0; k < 3; k++) K.wait(k * 0.15, () => K.mv('atp', [[158, 30 + k * 4], at(30, RR - 4)], 0.9, () => K.mv('adp', [at(40, RR + 4), [158, 60]], 0.8, null, true))); tot.atp += 6; }
    if (s === 3) { for (let k = 0; k < 3; k++) K.wait(k * 0.15, () => K.mv('nadph', [[158, 70 + k * 4], at(80, RR - 4)], 0.9, () => K.mv('nadp', [at(95, RR + 4), [158, 96]], 0.8, null, true))); tot.nadph += 6; }
    if (s === 4) { K.mv('g3p', [at(110), [70, 100]], 1.2, null, true); tot.g3p++; }

    cap();
  };

    draw() {

      const d = CAL[step], n = d.c, x0 = CX - (n - 1) * 3.5;
      for (let k = 0; k < n - 1; k++) K.line(x0 + k * 7, CY, x0 + (k + 1) * 7, CY, '#1a3a1a', true);
      for (let k = 0; k < n; k++) K.bead(Math.round(x0 + k * 7), CY, 'g', true);
      d.ps.forEach(k => { const px = x0 + k * 7; K.line(px, CY, px, CY - 8, '#1a3a1a', true); K.bead(Math.round(px), CY - 9, 'p', true); });

    }
  };
}

  let night = false, starch = 0.3, tAcc = 0, wallN = 0;

      const mu = (x - 104) / 13, mv = (y - 24) / 6; if (mu * mu + mv * mv <= 1) return (1 - Math.hypot(mu, mv)) * 6 < 1 ? '#4f1c06' : (((x * 2 + y) % 5) ? '#e88a45' : '#a8441a');

    });
    for (let k = 0; k < wallN; k++) K.put(150 + (k % 9), 89 + Math.floor(k / 9) % 6, '#f4e0b0');
  };
  K.labels([{ x: 36, y: 25, t: '엽록체' }, { x: 104, y: 13, t: '미토콘드리아' }, { x: 146, y: 54, t: '원형질연락사 →', c: 'r' }, { x: 120, y: 84, t: '세포벽 (셀룰로스)', c: 'r' }, { x: 38, y: 70, t: '녹말 입자' }]);
  const cap = () => { K.cap.innerHTML = night ? `<b>밤</b><br>빛이 없어 새 당을 만들지 못해요. 낮에 엽록체에 쌓아 둔 녹말을 분해해 미토콘드리아의 호흡과 다른 부위로 보낼 설탕을 계속 공급해요.` : `<b>낮</b><br>G3P(노랑)로 만든 당이 네 곳으로 가요. 미토콘드리아에서 세포호흡의 연료가 되고, 남으면 녹말로 저장되며, 설탕으로 바뀌어 원형질연락사와 잎맥을 통해 다른 세포로 가고, 셀룰로스가 되어 세포벽을 이뤄요.`; K.ctrl.querySelector('[data-i="0"]').setAttribute('aria-pressed', String(night)); };
  K.buttons([{ t: '밤·낮 바꾸기', pressed: false, fn: () => { night = !night; tAcc = 0; draw(); cap(); } }]);
  draw(); cap();
  let sAcc = 0;
  const one = () => {
    const r = Math.random();
    if (night) { if (starch <= 0.05) return; starch = Math.max(0.05, starch - 0.02); draw(); if (r < 0.5) K.mv('g3p', [[40, 50], [104, 24]], 1.2, () => K.mv('atp', [[104, 24], [104 + rnd(-10, 10), 6]], 0.8, null, true)); else K.mv('suc', [[40, 50], [140, 60], [158, 60]], 1.6, null, true); return; }
    if (!lightOn) return;

    else if (r < 0.55) { K.mv('g3p', [[50, 46], [40, 50]], 0.6, () => { starch = Math.min(1, starch + 0.03); draw(); }); }
    else if (r < 0.8) K.mv('suc', [[58, 52], [140, 60], [158, 60]], 1.6, null, true);
    else K.mv('g3p', [[50, 60], [150, 86]], 1.4, () => { wallN = Math.min(54, wallN + 1); draw(); });
  };
  return { step(dt) { K.tick(dt); sAcc += dt; if (sAcc > 0.55) { sAcc = 0; one(); } tAcc += dt; if (tAcc > 9) { tAcc = 0; night = !night; draw(); cap(); } }, draw() { K.flush(); K.drawMovers(); } };

  box.innerHTML = `<div class="cmp">
    <div><h3>동물세포에만</h3><ul>${item('lysosome', '리소좀')}${item('centrosome', '중심체와 중심립')}${item(null, '편모')}${item(null, '미세융모')}</ul></div>
    <div><h3>식물세포에만</h3><ul>${item('wall', '세포벽')}${item('chloroplast', '엽록체')}${item('vacuole', '중심 액포')}${item('plasmodesma', '원형질연락사')}</ul></div>

  </div>`;
  box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    const t = b.dataset.t; if (!ORG[t].cells.includes(kind)) setKind(ORG[t].cells[0]);
    const o = world.P.instances.find(i => i.type === t); if (!o) return;

}

function phaseStart(mode, i) { const L = PHASES[mode], tot = L.reduce((a, b) => a + b[1], 0); let acc = 0; for (let k = 0; k < i; k++) acc += L[k][1] / tot; return acc; }
function setDivRange(mode, i0, i1) { divSim.mode = mode; divSim.range = [phaseStart(mode, i0), i1 >= PHASES[mode].length ? 1 : phaseStart(mode, i1)]; divSim.t = divSim.range[0]; }
function divStep(dt) {
  const [a, b] = divSim.range; const span = Math.max(0.02, b - a);
  divSim.t += dt / divSim.dur;
  if (divSim.t > b) { divSim.t = a; divSim.orient = [0, 1, 2].map(() => Math.random() < 0.5 ? 1 : -1); }
}

function divDraw() {
  const plant = kind === 'plant', L = [];
  for (let i = 0; i < DW * DH; i++) dbuf[i] = pick3(DC.bg, i);
  const ph = phaseAt(divSim.mode, divSim.t); if (divSim.phase && divSim.phase !== ph.name) SFX.play('chime', 300); divSim.phase = ph.name; const f = ph.f;
  if (divSim.mode === 'binary') { drawBinary(ph, L); }
  else if (divSim.mode === 'mitosis') drawMitosis(ph, f, plant, L);
  else drawMeiosis(ph, f, plant, L);
  dctx2.putImageData(dimg, 0, 0); divSim.labels = L;
}

function drawMitosis(ph, f, plant, L) {
  const n = ph.i;
  let rx = 96, ry = 74, k = 0, poleD = 0, poleA = 0, env = 1, nucleolus = 1, cond = 0, mt = 0, splitDone = false;
  if (n === 1) { cond = ss(f); poleA = ss(f); nucleolus = 1 - ss(f * 2); }
  if (n === 2) { cond = 1; poleA = 1; env = 1 - ss(f); nucleolus = 0; mt = ss(f); }
  if (n === 3) { cond = 1; poleA = 1; env = 0; nucleolus = 0; mt = 1; }
  if (n === 4) { cond = 1; poleA = 1; env = 0; nucleolus = 0; mt = 1; rx = lerp(96, 118, ss(f)); ry = lerp(74, 66, ss(f)); }
  if (n === 5) { cond = 1 - ss(f); poleA = 1; env = 0; nucleolus = ss(f); mt = 1 - ss(f); rx = 118; ry = 66; k = ss(f); }
  if (n === 6) splitDone = true;
  // cell body
  if (splitDone) {
    if (plant) { DcellP(30, 26, 290, 174); Dseg(160, 30, 160, 170, 1.4, DC.wall[1]); L.push({ x: 160, y: 18, t: '새 세포벽' }); }
    else { DcellA(DCX - 64, DCY, 60, 56, 0, 'x'); DcellA(DCX + 64, DCY, 60, 56, 0, 'x'); }
    for (const s of [-1, 1]) { const nx = DCX + s * (plant ? 65 : 64); Dnucleus(nx, DCY, 26, 22, 1, 1); Dchromatin(nx, DCY, 24, 20, 1); }
    L.push({ x: DCX - 64, y: DCY + 46, t: '딸세포 (2n = 6)' }, { x: DCX + 64, y: DCY + 46, t: '딸세포 (2n = 6)' });
    return;
  }
  if (plant) DcellP(30, 26, 290, 174); else DcellA(DCX, DCY, rx, ry, k, 'x');
  // spindle poles
  const pd = n >= 2 ? lerp(58, 82, n === 2 ? ss(f) : 1) + (n === 4 ? 20 * ss(f) : n === 5 ? 20 : 0) : 58;
  const poles = [-1, 1].map(s => { const a = -Math.PI / 2 + s * (Math.PI / 2) * poleA; return n >= 2 ? [DCX + s * pd, DCY] : [DCX + Math.cos(a) * 54, DCY + Math.sin(a) * 50]; });
  // nucleus & chromatin
  if (n <= 2) { Dnucleus(DCX, DCY, 46, 40, env, nucleolus); Dchromatin(DCX, DCY, 42, 36, 1 - cond); }
  if (n === 5) for (const s of [-1, 1]) { Dnucleus(DCX + s * 82, DCY, lerp(8, 26, ss(f)), lerp(8, 22, ss(f)), ss(f * 1.3), nucleolus); Dchromatin(DCX + s * 82, DCY, 24, 20, ss(f)); }
  // chromosomes positions
  const kin = [];
  CHR.forEach((c, i) => {
    const col = c.par === 'm' ? DC.red : DC.blu, j = plateOrder.indexOf(i), plateY = DCY - 52 + j * 21;
    const pp = proPos[i], pro = [DCX + pp.x * 46, DCY + pp.y * 40], dirP = [Math.cos(pp.ang), Math.sin(pp.ang)];
    let cx, cy, dir = [0, 1], sep = 0, w = lerp(0.5, 1.4, cond), vs = false;
    if (n <= 1) { cx = pro[0]; cy = pro[1]; dir = dirP; }
    else if (n === 2) { const g = ss(f) * 0.9; cx = lerp(pro[0], DCX, g); cy = lerp(pro[1], plateY, g); dir = [lerp(dirP[0], 0, g), lerp(dirP[1], 1, g)]; }
    else if (n === 3) { cx = DCX + Math.sin(divSim.t * 300 + i) * 1.2; cy = plateY; }
    else { cx = DCX; cy = plateY; sep = n === 4 ? ss(f) : 1; vs = true; }
    if (cond < 0.15 && n <= 1) return;
    if (n <= 3) {
      const l = Math.hypot(dir[0], dir[1]) || 1; dir = [dir[0] / l, dir[1] / l]; const px = -dir[1], py = dir[0], o = w + 0.9;
      for (const s of [-1, 1]) { Dchromatid(cx + px * o * s, cy + py * o * s, dir[0], dir[1], c.L, w, col, col, 0); kin.push([cx + px * o * s, cy, s]); }
    } else {
      for (const s of [-1, 1]) {
        const tx = DCX + s * (5 + sep * (n === 5 ? 76 : 76)), ty = lerp(plateY, DCY + (plateY - DCY) * 0.4, sep);
        if (n === 5 && cond < 0.2) continue;
        Dchromatid(tx, ty, 0, 1, c.L * (n === 5 ? lerp(1, 0.6, f) : 1), w, col, col, 0, true, [-s, 0]); kin.push([tx, ty, s]);
      }
    }
  });
  // microtubules
  if (n >= 1) for (const [pi, p] of poles.entries()) { Daster(p[0], p[1], 10, n === 1 ? lerp(4, 12, f) : 12); }
  if (n === 1) { Dseg(poles[0][0], poles[0][1], poles[1][0], poles[1][1], 0, DC.mt, 3); }
  if (mt > 0) {
    kin.forEach(([x, y, s]) => { const p = poles[s < 0 ? 0 : 1]; if (hash(x | 0, y | 0, 3) < mt + 0.05) Dseg(p[0], p[1], x, y, 0, DC.mtB); });
    for (let k2 = -2; k2 <= 2; k2++) { Dseg(poles[0][0], poles[0][1], DCX + 14, DCY + k2 * 14, 0, DC.mt, 4); Dseg(poles[1][0], poles[1][1], DCX - 14, DCY + k2 * 14, 0, DC.mt, 4); }
  }
  poles.forEach(p => Dcentro(p[0], p[1], plant));
  // plant cell plate
  if (plant && n === 5) { const h = ss(f) * 70; for (let y = -h; y <= h; y += 1) DP(DCX, DCY + y, hash(0, y | 0, 9) < 0.7 ? DC.plate : DC.gr); for (let k2 = 0; k2 < 14; k2++) { const yy = DCY + (hash(k2, 1, 4) - 0.5) * 150; if (Math.abs(yy - DCY) > h) Ddisk(DCX + (hash(k2, 2, 4) - 0.5) * 6, yy, 1.2, DC.plate); } }
  // labels
  const lab = (x, y, t) => L.push({ x, y, t });
  if (n === 0) { lab(DCX, DCY - 50, '핵'); lab(DCX, DCY - 58 - 8, '중심체 2개'); lab(DCX + 20, DCY + 50, '염색질 (풀린 DNA)'); }
  if (n === 1) { lab(poles[0][0] - 10, poles[0][1] - 10, plant ? '방추체 극' : '중심체'); lab(DCX, DCY + 52, '응축하는 염색체'); }
  if (n === 2) { lab(DCX, DCY - 62, '조각나는 핵막'); lab(poles[1][0], poles[1][1] - 12, '방추체'); }
  if (n === 3) { lab(DCX, DCY - 66, '중기판'); lab(poles[0][0], poles[0][1] - 12, plant ? '극' : '중심체'); lab(DCX + 46, DCY + 40, '방추사부착점 미세소관'); }
  if (n === 4) { lab(DCX - 50, DCY - 60, '분리된 딸 염색체'); lab(DCX + 50, DCY - 60, '분리된 딸 염색체'); }
  if (n === 5) { lab(DCX, plant ? DCY - 78 : DCY - 72, plant ? '세포판' : '분할구'); lab(DCX - 82, DCY + 30, '핵막 재형성'); }
}

function drawMeiosis(ph, f, plant, L) {
  const n = ph.i, lab = (x, y, t) => L.push({ x, y, t });
  const tipOf = (c, s) => { // crossover colors
    const cross = n > 1 || (n === 1 && f > 0.55);
    if (!cross) return null; if (c.par === 'm' && s === 1) return DC.blu; if (c.par === 'p' && s === -1) return DC.red; return null;
  };
  const colOf = c => c.par === 'm' ? DC.red : DC.blu;
  if (n <= 4) {
    let rx = 96, ry = 74, k = 0, env = 1, cond = 0, poleA = 0;
    if (n === 1) { cond = ss(f * 1.4); poleA = ss(f); env = 1 - ss((f - 0.7) / 0.3); }
    if (n >= 2) { cond = 1; poleA = 1; env = 0; }
    if (n === 3) { rx = lerp(96, 116, ss(f)); ry = lerp(74, 66, ss(f)); }
    if (n === 4) { rx = 116; ry = 66; k = ss(f); }
    if (plant) DcellP(30, 26, 290, 174); else DcellA(DCX, DCY, rx, ry, k, 'x');
    const pd = n >= 2 ? 82 + (n >= 3 ? 18 * (n === 3 ? ss(f) : 1) : 0) : 54;
    const poles = [-1, 1].map(s => { const a = -Math.PI / 2 + s * (Math.PI / 2) * poleA; return n >= 2 ? [DCX + s * pd, DCY] : [DCX + Math.cos(a) * 54, DCY + Math.sin(a) * 50]; });
    if (n <= 1) { Dnucleus(DCX, DCY, 46, 40, env, 1 - cond); Dchromatin(DCX, DCY, 42, 36, 1 - cond); }
    if (plant && n === 4) { const h = ss(f) * 70; for (let y = -h; y <= h; y++) DP(DCX, DCY + y, DC.plate); }
    const kin = [];
    const pairC = [[DCX - 20, DCY - 14, 1.2], [DCX + 18, DCY - 4, 0.3], [DCX - 4, DCY + 20, 2.2]];
    CHR.forEach((c, i) => {
      const w = lerp(0.5, 1.3, cond); if (cond < 0.15) return;
      const pc = pairC[c.p], side = c.par === 'm' ? -1 : 1;
      let cx, cy, dir, vs = false;
      if (n === 1) { const gap = lerp(10, 3.2, ss(f * 1.6)); dir = [Math.cos(pc[2]), Math.sin(pc[2])]; cx = pc[0] - dir[1] * gap * side; cy = pc[1] + dir[0] * gap * side; }
      else { const o = divSim.orient[c.p], plateY = DCY - 40 + c.p * 40; const sideX = side * o; dir = [0, 1]; const g = n === 2 ? 0 : n === 3 ? ss(f) : 1; cx = DCX + sideX * (5 + g * 72); cy = lerp(plateY, DCY + (plateY - DCY) * 0.5, g); if (n === 4) cx = DCX + sideX * 77; }
      const px = -dir[1], py = dir[0];
      for (const s of [-1, 1]) { const o2 = (w + 0.6) * s * 0.9; const tc = tipOf(c, s); Dchromatid(cx + px * o2, cy + py * o2, dir[0], dir[1], c.L, w, colOf(c), tc || colOf(c), tc ? 0.38 : 0); }
      kin.push([cx, cy, n >= 2 ? (side * (n >= 2 ? divSim.orient[c.p] : 1)) : side]);
    });
    if (n === 1 && f > 0.35 && f < 0.85) pairC.forEach(pc => { const d = [Math.cos(pc[2]), Math.sin(pc[2])]; Dseg(pc[0] - d[0] * 8, pc[1] - d[1] * 8, pc[0] + d[0] * 10, pc[1] + d[1] * 10, 0, DC.gr); });
    if (n >= 1) poles.forEach(p => Daster(p[0], p[1], 10, n === 1 ? 4 + 8 * f : 12));
    if (n >= 2) kin.forEach(([x, y, s]) => { const p = poles[s < 0 ? 0 : 1]; Dseg(p[0], p[1], x, y, 0, DC.mtB); });
    poles.forEach(p => Dcentro(p[0], p[1], plant));
    if (n === 1) { lab(DCX, DCY - 52, f < 0.55 ? '상동염색체 짝짓기 (접합)' : '교차 → 교차점'); lab(DCX, DCY + 54, '빨강 모계 · 파랑 부계'); }
    if (n === 2) { lab(DCX, DCY - 68, '상동염색체 쌍이 중기판에'); }
    if (n === 3) { lab(DCX, DCY - 62, '상동염색체 분리 (자매염색분체는 붙어 있음)'); }
    if (n === 4) { lab(DCX - 70, DCY + 50, '반수체 n = 3'); lab(DCX + 70, DCY + 50, '반수체 n = 3'); lab(DCX, DCY - 72, plant ? '세포판' : '분할구'); }
    return;
  }
  // meiosis II
  const cells = [-1, 1].map(s => DCX + s * 78);
  if (n <= 8) {
    const k = n === 8 ? ss(f) : 0;
    if (plant) { DcellP(30, 26, 290, 174); Dseg(DCX, 30, DCX, 170, 1.4, DC.wall[1]); if (n === 8) { const h = ss(f) * 56; for (const cx of cells) for (let x = -h; x <= h; x++) DP(cx + x, DCY, DC.plate); } }
    else cells.forEach(cx => DcellA(cx, DCY, 66, n >= 7 ? lerp(58, 68, n === 7 ? ss(f) : 1) : 58, k, 'y'));
    cells.forEach((ccx, ci) => {
      const poles = [[ccx, DCY - 50], [ccx, DCY + 50]];
      if (n >= 5) poles.forEach(p => Daster(p[0], p[1], 8, 9));
      const mine = CHR.filter(c => (c.par === 'm' ? -1 : 1) * divSim.orient[c.p] === (ci === 0 ? -1 : 1));
      mine.forEach((c, j) => {
        const x = ccx - 24 + j * 24, base = c.par === 'm' ? DC.red : DC.blu;
        const g = n === 5 ? ss(f) : 1, w = 1.2;
        const sx = lerp(ccx + (j - 1) * 18, x, g), sy = lerp(DCY + (j - 1) * 10, DCY, g);
        for (const s of [-1, 1]) {
          const tc = (c.par === 'm' && s === 1) ? DC.blu : (c.par === 'p' && s === -1) ? DC.red : null;
          const sep = n === 7 ? ss(f) : n === 8 ? 1 : 0;
          const ty = sy + s * (2.2 + sep * 38);
          if (sep > 0) Dchromatid(sx, ty, 0, 1, c.L * 0.9, w, base, tc || base, tc ? 0.38 : 0, true, [0, -s]);
          else Dchromatid(sx, ty, 1, 0, c.L * 0.9, w, base, tc || base, tc ? 0.38 : 0);
          if (n >= 6) Dseg(poles[s < 0 ? 0 : 1][0], poles[s < 0 ? 0 : 1][1], sx, ty, 0, DC.mtB);
        }
      });
      poles.forEach(p => Dcentro(p[0], p[1], plant));
    });
    if (n === 6) lab(DCX, 18, '중기 II: 자매염색분체가 서로 다른 유전 구성');
    if (n === 7) lab(DCX, 18, '자매염색분체 분리');
    if (n === 8) lab(DCX, 18, plant ? '세포판 형성' : '세포질분열');
    return;
  }
  // 4 haploid cells
  const quad = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
  if (plant) { DcellP(30, 26, 290, 174); Dseg(DCX, 30, DCX, 170, 1.4, DC.wall[1]); Dseg(34, DCY, 286, DCY, 1.4, DC.wall[1]); }
  quad.forEach(([sx, sy], qi) => {
    const cx = DCX + sx * 78, cy = DCY + sy * 40;
    if (!plant) DcellA(cx, cy, 62, 36, 0, 'x');
    const ci = sx < 0 ? 0 : 1, s = sy;
    const mine = CHR.filter(c => (c.par === 'm' ? -1 : 1) * divSim.orient[c.p] === (ci === 0 ? -1 : 1));
    mine.forEach((c, j) => { const base = c.par === 'm' ? DC.red : DC.blu; const tc = (c.par === 'm' && s === 1) ? DC.blu : (c.par === 'p' && s === -1) ? DC.red : null; Dchromatid(cx - 22 + j * 22, cy - 2, 0, 1, c.L * 0.8, 1.1, base, tc || base, tc ? 0.38 : 0); });
    lab(cx, cy + 26, 'n = 3');
  });
}

function drawBinary(ph, L) {
  const n = ph.i, f = ph.f;
  let hl = 60, k = 0, rep = 0, sepd = 0, two = false;
  if (n === 0) { rep = 0.1 * f; }
  if (n === 1) { rep = lerp(0.1, 1, f); hl = lerp(60, 84, f); sepd = ss(f) * 0.7; }
  if (n === 2) { rep = 1; hl = lerp(84, 108, ss(f)); sepd = lerp(0.7, 1, ss(f)); }
  if (n === 3) { rep = 1; hl = 108; sepd = 1; k = ss(f); }
  if (n === 4) two = true;
  const R = 30;
  const capsule = (cx, cy, h, kk) => {
    for (let y = cy - R - 2; y <= cy + R + 2; y++) for (let x = cx - h - R - 2; x <= cx + h + R + 2; x++) {
      if (x < 0 || y < 0 || x >= DW || y >= DH) continue;
      const qx = Math.max(Math.abs(x - cx) - h, 0), pinch = 1 - kk * 0.97 * Math.exp(-((x - cx) ** 2) / 180), d = Math.hypot(qx, (y - cy) / pinch), i = y * DW + x;
      if (d > R) continue; const e = R - d; dbuf[i] = e < 1.4 ? DC.mem : e < 2.4 ? DC.mem2 : pick3(DC.bact, i);
    }
  };
  const loop = (cx, cy, rr, frac, oriX) => { const N = 120; for (let i = 0; i < N * frac; i++) { const a = i / N * Math.PI * 2; const r = rr * (1 + 0.18 * Math.sin(a * 7) + 0.1 * Math.sin(a * 13)); DP(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 0.7, DC.bluL); } Ddisk(oriX, cy, 2.2, DC.ori); };
  if (two) { capsule(DCX - 70, DCY, 50, 0); capsule(DCX + 70, DCY, 50, 0); loop(DCX - 70, DCY, 16, 1, DCX - 70 + 16 * 1.3); loop(DCX + 70, DCY, 16, 1, DCX + 70 - 16 * 1.3); L.push({ x: DCX - 70, y: DCY + 40, t: '딸세포' }, { x: DCX + 70, y: DCY + 40, t: '딸세포' }); return; }
  capsule(DCX, DCY, hl, k);
  const off = sepd * (hl * 0.62);
  loop(DCX - off, DCY, 16, 1, DCX - off - 16 * 1.3 * (sepd > 0.05 ? 1 : 0));
  if (rep > 0.02) loop(DCX + off, DCY, 16, rep, DCX + off + 16 * 1.3 * (sepd > 0.05 ? 1 : 0.2));
  L.push({ x: DCX, y: DCY - 40, t: n === 0 ? '복제원점 (노랑)' : n === 1 ? '복제되는 원형 염색체' : n === 3 ? '세포막이 안으로 자람' : '두 배로 자란 세포' });
}

    <ol class="stages">${DSTAGES.map((s, i) => `<li><button data-st="${i}"><span class="n">${i + 1}</span>${s.name}</button></li>`).join('')}</ol>
    <article id="stagecard" aria-live="polite"></article>
    <div class="stnav"><button class="btn" id="sprev">이전 단계</button><button class="btn primary" id="snext">다음 단계</button></div>`;
  divPane.querySelectorAll('[data-st]').forEach(b => b.onclick = () => enterStage(+b.dataset.st));
  document.getElementById('sprev').onclick = () => enterStage(tour.stage - 1);
  document.getElementById('snext').onclick = () => enterStage(tour.stage + 1);
}

// 1. double helix
function gHelix(box) {

  const cap = () => { K.cap.innerHTML = view === 'helix' ? '<b>이중나선</b><br>바깥의 두 리본이 당-인산 골격이고, 안쪽 가로대가 염기쌍이에요. 나선이 한 바퀴 도는 동안 염기쌍 10개가 쌓여요(3.4 nm).' : '<b>펼친 사다리</b><br>위아래 가닥은 방향이 반대예요(역평행). 긴 막대는 고리 2개인 퓨린(A, G), 짧은 막대는 고리 1개인 피리미딘(T, C)이에요. 짝을 이루면 길이가 늘 같아 지름이 일정해요. 점은 수소결합이에요.'; K.ctrl.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === view))); K.labels(view === 'helix' ? [{ x: 150, y: 6, t: '3.4 nm = 10 bp', c: 'r dim' }] : [{ x: 4, y: 20, t: '5′', c: 'l' }, { x: 156, y: 20, t: '3′', c: 'r' }, { x: 4, y: 78, t: '3′', c: 'l' }, { x: 156, y: 78, t: '5′', c: 'r' }]); };

// 3. origins
function gOrigin(box) {
  const K = kit(box, 160, 96, { alt: '복제원점과 복제기포' });
  let mode = 'bac', t = 0;
  const cap = () => { K.cap.innerHTML = mode === 'bac' ? '<b>세균의 원형 염색체</b><br>복제원점 하나에서 기포가 생기고, 두 복제분기점(빨강)이 반대 방향으로 진행해 반대편에서 만나면 두 개의 딸 DNA가 돼요. 진한 선은 원래 가닥, 밝은 선은 새 가닥이에요.' : '<b>진핵생물의 선형 염색체</b><br>여러 복제원점에서 동시에 기포가 생겨 양방향으로 커지다가 합쳐져요. 최종적으로 두 개의 딸 분자가 돼요.'; K.ctrl.querySelectorAll('[data-m]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mode))); };
  K.ctrl.innerHTML = `<button class="sbtn" data-m="bac">세균</button><button class="sbtn" data-m="euk">진핵생물</button>`;
  K.ctrl.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; t = 0; cap(); });
  darkBg(K); cap();
  return {
    step(dt) { t = (t + dt) % 8; },
    draw() {
      K.flush(); const f = Math.min(1, t / 6);
      if (mode === 'bac') {
        const ang = f * Math.PI, sep = t > 6 ? (t - 6) * 18 : 0;
        if (sep === 0) {
          for (let a = 0; a < 6.283; a += 0.01) { const inB = Math.abs(((a + Math.PI / 2 + 6.283) % 6.283) - Math.PI) > Math.PI - ang; const x = 80 + Math.cos(a) * 30, y = 48 + Math.sin(a) * 30; if (inB) { K.dot(80 + Math.cos(a) * 34, 48 + Math.sin(a) * 34, '#1f6a80'); K.dot(80 + Math.cos(a) * 31, 48 + Math.sin(a) * 31, '#9fe0f0'); K.dot(80 + Math.cos(a) * 26, 48 + Math.sin(a) * 26, '#1f6a80'); K.dot(80 + Math.cos(a) * 29, 48 + Math.sin(a) * 29, '#9fe0f0'); } else { K.dot(x, y, '#2f9ab0'); K.dot(x, y + 1, '#1f6a80'); } }
          for (const s of [-1, 1]) { const a = -Math.PI / 2 + s * ang; K.pat(80 + Math.cos(a) * 30, 48 + Math.sin(a) * 30, ['.a.', 'aaa', '.a.'], { a: '#ff4a4a' }); }
          K.pat(80, 18, ['a'], { a: '#ffe066' });
        } else for (const s of [-1, 1]) for (let a = 0; a < 6.283; a += 0.01) { K.dot(80 + s * (sep + 4) + Math.cos(a) * 26, 48 + Math.sin(a) * 26, '#1f6a80'); K.dot(80 + s * (sep + 4) + Math.cos(a) * 24, 48 + Math.sin(a) * 24, '#9fe0f0'); }
        K.labels([{ x: 80, y: 8, t: '복제원점' }]);
      } else {
        const ori = [34, 80, 126], r = f * 26;
        for (let x = 4; x <= 156; x++) {
          const inB = ori.some(o => Math.abs(x - o) < r);
          if (inB && t < 6.5) { const o = ori.find(o2 => Math.abs(x - o2) < r); const h = 6 * Math.sqrt(Math.max(0, 1 - ((x - o) / r) ** 2)) * (r < 22 ? 1 : 1); K.dot(x, 48 - h - 2, '#1f6a80'); K.dot(x, 48 - h, '#9fe0f0'); K.dot(x, 48 + h + 2, '#1f6a80'); K.dot(x, 48 + h, '#9fe0f0'); }
          else if (t >= 6.5) { K.dot(x, 36, '#1f6a80'); K.dot(x, 38, '#9fe0f0'); K.dot(x, 58, '#1f6a80'); K.dot(x, 60, '#9fe0f0'); }
          else { K.dot(x, 47, '#2f9ab0'); K.dot(x, 49, '#1f6a80'); }
        }
        if (t < 6.5) ori.forEach(o => { K.pat(o - r, 48, ['a', 'a'], { a: '#ff4a4a' }); K.pat(o + r, 48, ['a', 'a'], { a: '#ff4a4a' }); K.dot(o, 48, '#ffe066'); });
        K.labels(t < 6.5 ? [{ x: 34, y: 66, t: '원점' }, { x: 80, y: 66, t: '원점' }, { x: 126, y: 66, t: '원점' }] : [{ x: 80, y: 80, t: '두 개의 딸 분자' }]);
      }
    }
  };
}

// 4. replication fork
function gFork(box) {
  const K = kit(box, 160, 100, { alt: '복제분기점에서 선도가닥과 지연가닥이 합성되는 모습' });
  darkBg(K);
  let fx, frags, last, msg, msgT = 0;
  const reset = () => { fx = 40; frags = [{ r: 40, l: 4, ext: 4, prim: false, lig: true, pol1: 1 }]; last = 40; msg = '헬리케이스가 이중나선을 풀며 오른쪽으로 나아가요.'; };
  reset();
  const say = m => { if (msg !== m) { msg = m; cap(); } };
  const cap = () => { K.cap.innerHTML = `<b>지금 일어나는 일</b><br>${msg}<span class="mini">헬리케이스(초록) · 단일가닥 결합 단백질(회색) · 회전효소(파랑) · 프리메이스(분홍) · DNA 중합효소 III(주황) · DNA 중합효소 I(노랑) · DNA 연결효소(청록)</span>`; };
  K.labels([{ x: 156, y: 42, t: '부모 DNA', c: 'r dim' }, { x: 4, y: 22, t: '선도가닥 →', c: 'l' }, { x: 4, y: 86, t: '← 지연가닥 (오카자키 절편)', c: 'l' }]);
  K.buttons([{ t: '처음부터', fn: () => { reset(); cap(); } }]);
  cap();
  return {
    step(dt) {
      fx += dt * 6; if (fx > 146) { reset(); cap(); return; }
      if (fx - last > 24) { last = fx; frags.push({ r: fx - 4, l: fx - 4, ext: fx - 4, prim: true, lig: false, pol1: 0, made: 0 }); say('프리메이스가 지연가닥 주형에 새 RNA 프라이머(빨강)를 만들어요.'); }
      for (let i = 1; i < frags.length; i++) {
        const fr = frags[i], prev = frags[i - 1];
        if (fr.ext > prev.r + 0.5) { fr.ext = Math.max(prev.r, fr.ext - dt * 14); if (fr.ext < fr.r - 6) say('DNA 중합효소 III가 프라이머에 이어 오카자키 절편을 왼쪽(5′→3′)으로 늘려요.'); }
        else if (prev.prim && prev.pol1 < 1) { prev.pol1 = Math.min(1, prev.pol1 + dt * 0.8); say('DNA 중합효소 I이 앞 절편의 RNA 프라이머를 DNA로 바꿔요.'); if (prev.pol1 >= 1) prev.prim = false; }
        else if (!fr.lig && !prev.prim) { fr.lig = true; fr.ligT = 0.8; say('DNA 연결효소가 두 절편 사이의 틈을 이어요.'); }
        if (fr.ligT) fr.ligT = Math.max(0, fr.ligT - dt);
      }
    },
    draw() {
      K.flush();
      // parental duplex right of fork
      for (let x = Math.round(fx); x <= 158; x++) { K.dot(x, 46, '#2f9ab0'); K.dot(x, 54, '#2f9ab0'); if (x % 3 === 0) K.line(x, 47, x, 53, x % 6 ? '#5fd06a' : '#ffb040', true); }
      // templates left of fork
      const ty = x => { const d = fx - x; return d < 10 ? 46 - d * 1.4 : 32; }, by = x => { const d = fx - x; return d < 10 ? 54 + d * 1.4 : 68; };
      for (let x = 2; x < fx; x++) { K.dot(x, ty(x), '#2f9ab0'); K.dot(x, by(x), '#2f9ab0'); }
      // leading strand
      for (let x = 2; x < fx - 9; x++) { K.dot(x, 36, '#ff9a3c'); if (x % 3 === 0) K.line(x, 33, x, 35, '#8fa0c0', true); }
      K.blob(fx - 10, 36, 4, 3, ['#a04a10', '#d06a2a', '#ff9a3c'], '#401a04', true);
      // lagging fragments
      frags.forEach((fr, i) => {
        for (let x = Math.round(fr.ext); x <= fr.r; x++) { const inPrim = fr.prim && x > fr.r - 4 - (1 - fr.pol1) * 0 && x > fr.r - 4; K.dot(x, 64, inPrim ? (x > fr.r - 4 + 4 * fr.pol1 ? '#ff3a3a' : '#ff9a3c') : '#ff9a3c'); if (x % 3 === 0) K.line(x, 65, x, 67, '#8fa0c0', true); }
        if (!fr.lig && i > 0) K.dot(fr.ext - 1, 64, '#0b0f1c');
        if (fr.ligT > 0) K.blob(fr.ext, 64, 3, 2.5, ['#1f6a6a', '#38c9bb', '#9fffe0'], '#0a2a2a', true);
        if (i > 0 && fr.ext > frags[i - 1].r + 0.5) K.blob(fr.ext - 2, 63, 4, 3, ['#a04a10', '#d06a2a', '#ff9a3c'], '#401a04', true);
        if (i > 0 && frags[i - 1].prim && frags[i - 1].pol1 > 0 && frags[i - 1].pol1 < 1) K.blob(frags[i - 1].r - 3, 63, 3, 2.5, ['#a08a10', '#e0c040', '#fff080'], '#3a3004', true);
      });

  const cap = s => { K.cap.innerHTML = ['<b>mRNA 전구체</b><br>엑손(주황)과 인트론(회색)이 모두 전사된 1차 전사체예요.', '<b>5′ 캡과 폴리A 꼬리</b><br>5′ 끝에 변형된 G(노랑)가, 3′ 끝에 아데닌 50~250개(흰색)가 붙어요.', `<b>RNA 스플라이싱</b><br>인트론이 고리 모양으로 잘려 나가고 엑손이 이어져요.${alt ? ' 선택적 스플라이싱으로 엑손 2까지 빠졌어요.' : ''}`, `<b>성숙한 mRNA</b><br>양 끝의 UTR(연한 색)은 번역되지 않고, 가운데 암호화 영역만 단백질이 돼요.${alt ? ' 엑손 2가 빠진 다른 단백질이 만들어져요.' : ' β-글로빈이라면 코돈 1~30, 31~104, 105~146이 이어진 146개 아미노산이에요.'}`][s]; };
  K.buttons([{ t: '선택적 스플라이싱', pressed: false, fn: b => { alt = !alt; b.setAttribute('aria-pressed', String(alt)); } }]);
  let lastS = -1;
  return {
    step(dt) { t = (t + dt) % 10; const s = t < 2 ? 0 : t < 4 ? 1 : t < 7 ? 2 : 3; if (s !== lastS) { lastS = s; cap(s); } },
    draw() {
      K.flush(); const s = t < 2 ? 0 : t < 4 ? 1 : t < 7 ? 2 : 3, f = s === 2 ? (t - 4) / 3 : 1;
      let x = 12; const y = 48, keep = k => !k.startsWith('i') && !(alt && k === 'e2');
      const total = SEG.reduce((a, [k, w]) => a + (s === 3 && !keep(k) ? 0 : w), 0), off = s === 3 ? (144 - total) / 2 : 0; x += off;
      SEG.forEach(([k, w]) => {

        if (s === 2 && removed) { for (let a = 0; a < 6.28; a += 0.1) K.dot(x + ww / 2 + Math.cos(a) * w * 0.25, y - 12 * f - 6 + Math.sin(a) * 6 * f, col[k]); }
        for (let xx = x; xx < x + ww; xx++) for (let yy = y - 3; yy <= y + 3; yy++) K.dot(xx, yy, col[k]);
        x += ww;
      });

      K.labels(s === 3 ? [{ x: 80, y: 62, t: '암호화 영역' }, { x: 12 + off, y: 34, t: '5′ 캡', c: 'l' }, { x: 150, y: 34, t: '폴리A 꼬리', c: 'r' }] : [{ x: 21, y: 62, t: '엑손 1' }, { x: 62, y: 62, t: '엑손 2' }, { x: 120, y: 62, t: '엑손 3' }, { x: 40, y: 32, t: '인트론' }, { x: 92, y: 32, t: '인트론' }]);

}

  const reset = () => { pos = 0; phase = 0; t = 0; chain = cods.length ? [cods[0].a] : []; updSeq(); cap(); };
  reset();
  const trna = (x, y, aa, anti, alpha = 1) => {

      K.g.globalAlpha = 0.85; K.blob(80, 50, 34, 18, ['#8a3a10', '#b5561f', '#d07a3a', '#e8a070'], '#3a1406', true); K.g.globalAlpha = 1;
      const shift = phase === 3 ? (t / 1.3) * 16 : 0;

      const n = step === 0 ? 2 + f * 3 : step === 1 || step === 2 ? 5 : step === 3 ? 5 + f * 6 : 11;
      for (let k = 0; k < n; k++) { const sig = k < 4 && step < 4; let px, py; if (step >= 3) { px = rx + Math.sin(k) * 2; py = ry + 6 + k * 3; } else { px = rx - 6 - k * 2; py = ry - 4 - k * 2; } if (step === 4 && k < 4) continue; if (step === 5) { px = 100 + Math.cos(k * 0.9) * 8; py = 82 + Math.sin(k * 0.9) * 6; } K.pat(px, py, ['aa', 'aa'], { a: sig ? '#48d06a' : '#7a6ad0' }); }
      if (step === 4) for (let k = 0; k < 4; k++) K.pat(rx + 14 + k * 2, 70 + k * 2 + f * 6, ['aa'], { a: '#48d06a' });
      if (step >= 1 && step <= 3) { const sx = step === 3 ? lerp(rx - 12, 20, f) : rx - 12, sy = step === 3 ? lerp(ry - 8, 10, f) : ry - 8; K.blob(sx, sy, 5, 4, ['#a05a10', '#e08a30', '#ffc070'], '#3a2004', true); }
    }
  };

    } else if (T === 'chloroplast') {

        for (const p of st.h) { const nu = p[0] + rnd(-1, 1) * dt * 3, nv = p[1] + rnd(-1, 1) * dt * 3; if (chloroRegion(o, nu, nv) === 'granum') { p[0] = nu; p[1] = nv; } }
        if (lightOn && Math.random() < dt * 3) { const n = Math.max(3, Math.round(o.rx / 8)), g = Math.floor(rnd(0, n)), gu = -o.rx * 0.68 + (2 * o.rx * 0.68) * g / (n - 1); st.ph.push({ u: gu + rnd(-2, 2), v: rnd(-o.ry * 0.4, o.ry * 0.4), t: 0 }); }

        st.ph = st.ph.filter(ph => { if (ph.t >= 1) { st.sp.push({ u: ph.u + rnd(-4, 4), v: ph.v + (Math.random() < 0.5 ? -1 : 1) * o.ry * 0.62, life: 1.1, nadph: Math.random() < 0.4 }); return false; } return true; });

      }
      for (const p of st.h) { const [x, y] = mloc2(o, p[0], p[1]); px(x, y, '#ff3a6a'); }
      for (const ph of st.ph) { const [x, y] = mloc2(o, ph.u, ph.v); const sx = x - 10 * (1 - ph.t), sy = y - 14 * (1 - ph.t); for (let k = 0; k < 4; k++) px(sx - k * 0.5, sy - k * 0.7, k ? '#fff3a0' : '#ffffff'); }
      for (const sp of st.sp) { const [x, y] = mloc2(o, sp.u, sp.v); ctx.globalAlpha = a * Math.min(1, sp.life); pat(x, y, sp.nadph ? ['aaa', 'aba'] : ['.a.', 'aba', '.a.'], sp.nadph ? { a: '#ff6a2a', b: '#ffe0c0' } : { a: '#ffe066', b: '#ffffff' }); ctx.globalAlpha = a; }
    } else if (T === 'nucleus') {

        else { pat(x, y, ['.aa.', 'abba', '.aa.'], { a: '#f39250', b: '#c7652a' }); pat(x + 0.9, y + 0.6, ['aa', 'aa'], { a: '#ffc08a' }); }

      if (live && st.m.length < 2 && Math.random() < dt) { }
    } else if (T === 'rer') {

        st.ves = st.ves.filter(v => v.life > 0);
      }
      for (const c of st.cargo) { const i = Math.floor(c.i), off = (i - 2.5) * 5.2, L = 26 - Math.abs(i - 2.5) * 3.2; if (Math.abs(c.s) > L) continue; const [x, y] = at(c.s, off - 0.018 * c.s * c.s); px(x, y, ['#c49bff', '#b49bff', '#a0a8ff', '#90c0ff', '#80d8e0', '#7fffa0'][i], 1.2); }
      for (const v of st.ves) { const [x, y] = at(v.s, v.n); if (!vis(x, y)) continue; ctx.fillStyle = '#3d8a45'; ctx.beginPath(); ctx.arc(ox + x * s, oy + y * s, s * 1.3, 0, 6.283); ctx.fill(); ctx.strokeStyle = v.tr ? '#c4f5bc' : '#9fe0f0'; ctx.lineWidth = Math.max(1, q * 0.7); ctx.stroke(); px(x, y, v.tr ? '#7fffa0' : '#c49bff', 1.5); }
    } else if (T === 'vacuole') {
      const V = S.vacuole, st = mlState(o, () => ({ p: Array.from({ length: 50 }, () => { const a2 = rnd(0, 6.28), r = Math.sqrt(Math.random()) * 0.9; return { x: V.x + Math.cos(a2) * V.rx * r, y: V.y + Math.sin(a2) * V.ry * r, c: Math.random() < 0.3 ? '#b28ad8' : '#cfe6ff' }; }), w: [] }));
      if (live) { for (const p of st.p) { const nx = p.x + rnd(-1, 1) * dt * 2, ny = p.y + rnd(-1, 1) * dt * 2; if (((nx - V.x) / V.rx) ** 2 + ((ny - V.y) / V.ry) ** 2 < 0.85) { p.x = nx; p.y = ny; } } if (Math.random() < dt * 3) { const a2 = rnd(0, 6.28); st.w.push({ a: a2, t: 0 }); } for (const w of st.w) w.t += dt * 0.6; st.w = st.w.filter(w => w.t < 1); }

  if (s >= 8) for (let i = 0; i < S.ribo.length; i += 3) { const r = S.ribo[i]; if (!vis(r.x, r.y)) continue; const n = Math.floor((ML.t * 1.5 + i * 0.37) % 6); for (let k = 0; k < n; k++) px(r.x + 1.2 + Math.sin(k * 1.3 + i) * 0.4 + k * 0.2, r.y - 0.5 - k * 0.3, '#c49bff'); }

}

// ---------- tabs ----------
const tabs = { org: document.getElementById('tab-org'), struct: document.getElementById('tab-struct'), div: document.getElementById('tab-div'), gene: document.getElementById('tab-gene'), plant: document.getElementById('tab-plant'), resp: document.getElementById('tab-resp'), photo: document.getElementById('tab-photo') };
const panes = { struct: structPane, div: divPane, gene: genePane, plant: plantPane, resp: respPane, photo: photoPane };

const tabList = [tabs.org, tabs.struct, tabs.div, tabs.gene, tabs.resp, tabs.photo, tabs.plant];
Object.entries(tabs).forEach(([k, b]) => b.onclick = () => setTab(k));
